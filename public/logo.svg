<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="24" y1="90" x2="104" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="2" />

  <!-- Open Manuscript / Story Pages -->
  <!-- Left Page -->
  <path d="M64 94C52 90 36 90 24 96V44C36 38 52 38 64 42V94Z" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-linejoin="round" />
  <path d="M64 94C52 90 36 90 28 95V48C38 43 52 43 64 46V94Z" fill="url(#primaryGrad)" fill-opacity="0.2" />

  <!-- Right Page -->
  <path d="M64 94C76 90 92 90 104 96V44C92 38 76 38 64 42V94Z" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-linejoin="round" />
  <path d="M64 94C76 90 92 90 100 95V48C90 43 76 43 64 46V94Z" fill="url(#primaryGrad)" fill-opacity="0.35" />

  <!-- Center Spine Seam -->
  <path d="M64 42V95" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Story Line Narrative Arc with Glow -->
  <path d="M28 82C40 76 50 46 64 54C78 62 86 38 100 32" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M28 82C40 76 50 46 64 54C78 62 86 38 100 32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="0.5 5" />

  <!-- Interconnected Sequence Nodes -->
  <!-- Node 1: Beginning -->
  <circle cx="28" cy="82" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="28" cy="82" r="2" fill="#ffffff" />

  <!-- Node 2: Turning Point -->
  <circle cx="64" cy="54" r="5.5" fill="#0f172a" stroke="#818cf8" stroke-width="3" />
  <circle cx="64" cy="54" r="2.5" fill="#ffffff" />

  <!-- Node 3: Climax -->
  <circle cx="100" cy="32" r="5" fill="#0f172a" stroke="#c084fc" stroke-width="3" />
  <circle cx="100" cy="32" r="2" fill="#ffffff" />

  <!-- Creative Spark at Climax -->
  <path d="M106 22L108 27L113 29L108 31L106 36L104 31L99 29L104 27Z" fill="#38bdf8" />
  <circle cx="106" cy="29" r="1.5" fill="#ffffff" />
</svg>
